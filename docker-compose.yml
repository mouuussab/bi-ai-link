version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: datalake-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set datalake http://minio:9000 admin password123;
      /usr/bin/mc mb datalake/rivus-data;
      /usr/bin/mc anonymous set public datalake/rivus-data;
      exit 0;
      "

  sync-worker:
    build: .
    container_name: datalake-sync-worker
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - MYSQL_HOST=your_rivus_bi_mysql_host
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root_password
      - MYSQL_DATABASE=metatron
      - RIVUS_AI_URL=http://your_rivus_ai_host:port/api/refresh
    depends_on:
      - minio
    volumes:
      - .:/app

volumes:
  minio_data:
